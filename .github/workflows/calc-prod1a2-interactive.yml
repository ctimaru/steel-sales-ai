name: CALC-PROD1A.2 Interactive Production Discovery
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  interactive-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chrome
      - name: Check JS syntax
        run: node --check tests/calc-prod1a2-interactive-discovery.mjs
      - name: Run read-only discovery
        run: node tests/calc-prod1a2-interactive-discovery.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calc-prod1a2-interactive-evidence
          path: apps/web/artifacts/calc-prod1a2/
          retention-days: 7
