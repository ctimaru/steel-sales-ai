name: P0 Required Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    name: classify changes
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.changes.outputs.web }}
      worker: ${{ steps.changes.outputs.worker }}
      supabase: ${{ steps.changes.outputs.supabase }}
      all: ${{ steps.changes.outputs.all }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "web=true" >> "$GITHUB_OUTPUT"
            echo "worker=true" >> "$GITHUB_OUTPUT"
            echo "supabase=true" >> "$GITHUB_OUTPUT"
            echo "all=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
            BASE="$(git rev-parse HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)"
          fi

          git diff --name-only "$BASE" "$GITHUB_SHA" > /tmp/changed-files.txt
          cat /tmp/changed-files.txt

          grep -Eq '^(apps/web/.*|\.github/workflows/frontend-ci\.yml)$' /tmp/changed-files.txt && WEB=true || WEB=false
          grep -Eq '^(services/worker/.*|railway\.json|\.github/workflows/worker-ci\.yml)$' /tmp/changed-files.txt && WORKER=true || WORKER=false
          grep -Eq '^(supabase/.*|\.github/workflows/supabase-p0-ci\.yml)$' /tmp/changed-files.txt && SUPABASE=true || SUPABASE=false
          grep -Eq '^\.github/workflows/p0-required-gate\.yml$' /tmp/changed-files.txt && ALL=true || ALL=false

          echo "web=$WEB" >> "$GITHUB_OUTPUT"
          echo "worker=$WORKER" >> "$GITHUB_OUTPUT"
          echo "supabase=$SUPABASE" >> "$GITHUB_OUTPUT"
          echo "all=$ALL" >> "$GITHUB_OUTPUT"

  secret-scan:
    name: tracked secret guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked secret material
        shell: python
        run: |
          import pathlib, re, subprocess, sys

          tracked = subprocess.check_output(["git", "ls-files"], text=True).splitlines()
          forbidden_names = [p for p in tracked if pathlib.PurePosixPath(p).name == ".env"]
          if forbidden_names:
              print("Tracked .env files are forbidden:", *forbidden_names, sep="\n")
              sys.exit(1)

          patterns = [
              re.compile(r"hf_[A-Za-z0-9]{20,}"),
              re.compile(r"sb_secret_[A-Za-z0-9_-]{20,}"),
              re.compile(r"(?i)(SUPABASE_SERVICE_ROLE_KEY|WORKER_INTERNAL_TOKEN|HF_TOKEN)\s*=\s*['\"]?(?!\$|<|\{)[^\s'\"]{16,}"),
          ]
          findings = []
          for name in tracked:
              path = pathlib.Path(name)
              if path.suffix.lower() in {".png", ".jpg", ".jpeg", ".gif", ".pdf", ".zip"}:
                  continue
              try:
                  text = path.read_text(errors="ignore")
              except OSError:
                  continue
              for number, line in enumerate(text.splitlines(), 1):
                  if any(p.search(line) for p in patterns):
                      findings.append(f"{name}:{number}")
          if findings:
              print("Potential secret material found in tracked files:", *findings, sep="\n")
              sys.exit(1)
          print("Tracked secret guard passed")

  frontend:
    name: frontend
    needs: classify
    if: needs.classify.outputs.web == 'true' || needs.classify.outputs.all == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  worker:
    name: worker
    needs: classify
    if: needs.classify.outputs.worker == 'true' || needs.classify.outputs.all == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/worker/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: pytest -q

  supabase:
    name: supabase foundation
    needs: classify
    if: needs.classify.outputs.supabase == 'true' || needs.classify.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Inject CI-only historical baselines
        run: |
          cp supabase/ci/p0_pre_worker_baseline.sql supabase/migrations/20260908000000_ci_pre_worker_baseline.sql
          cp supabase/ci/p0_staging_baseline.sql supabase/migrations/20260908000001_ci_staging_baseline.sql
      - name: Start and rebuild local Supabase
        run: |
          supabase start
          supabase db reset --local
      - name: Run Foundation + P1 acceptance suite
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for test in \
            p0_tenant_isolation.sql \
            p0_steel_ontology.sql \
            p0_parser_contract_v4.sql \
            p0_entity_resolution.sql \
            p0_observability.sql \
            p0_data_lifecycle.sql \
            p1_tenant_onboarding.sql \
            p1_team_directory.sql \
            p1_bulk_import.sql \
            p1_data_source_center.sql \
            p1_global_search.sql \
            p1_product_360.sql \
            p1_price_history.sql \
            p1_shared_steel_knowledge.sql \
            p1_shared_steel_seed.sql \
            p1_shared_steel_reference_api.sql \
            p1_reference_database_v2.sql \
            p1_structural_reference_catalog.sql \
            p1_pressure_reference_catalog.sql \
            p1_en10217_range_envelopes.sql \
            p1_shared_private_e2e.sql \
            p1_us_api_reference_foundation.sql \
            p1_us_api_nps_schedule_sample.sql \
            p1_us_api_nps_schedule_expansion.sql \
            p1_us_api_sa_dn_designations.sql \
            p1_human_correction_loop.sql \
            pa2_org_safe_fk_foundation.sql \
            pa2_rfq_relationship_foundation.sql \
            pa2_offer_order_relationship_foundation.sql \
            pa2_immutable_promotion_ledger.sql \
            pa2_normalized_chain_e2e.sql \
            pa23_controlled_read_bridge.sql \
            pa23_requested_promotion_service.sql \
            pa24_promotion_readiness.sql \
            pa25_grouped_rfq_promotion.sql \
            pa26_source_identity_enrichment.sql \
            pa27_structured_message_identity.sql \
            pa28_exact_email_contact_resolution.sql \
            pa29_verified_company_identity.sql \
            pa210_identity_confirmation_workflow.sql \
            pa211_company_360.sql \
            pa212_company_activation.sql \
            pa215_normalization_coverage.sql \
            pa216_controlled_rfq_backlog_promotion.sql \
            pa217_controlled_offer_promotion.sql \
            pa218_controlled_order_promotion.sql \
            pa219_normalized_commercial_explorer.sql \
            pa221_operational_relationship_activation.sql \
            pa222_conversation_backfill_readiness.sql \
            pa223_structured_conversation_coverage_expansion.sql \
            pa225_relationship_gap_offer_recovery.sql \
            pa226_offer_evidence_remediation_readiness.sql \
            pa227_offer_source_reparse_contract.sql \
            pa228_controlled_offer_source_reparse_execution.sql \
            pa229_reparse_candidate_review_controlled_adoption.sql \
            pa230_reparse_remediation_resolution_closure.sql; do
            psql --host 127.0.0.1 --port 54322 --username postgres --dbname postgres \
              --set ON_ERROR_STOP=1 --file "supabase/tests/$test"
          done
      - name: Verify tenant helper and lint
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --port 54322 --username postgres --dbname postgres \
            --set ON_ERROR_STOP=1 --command "select public.default_organization_for_user(null::uuid);"
          supabase db lint --local --level warning
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/worker/pyproject.toml
      - name: Run worker/RAG regression suite against foundation
        working-directory: services/worker
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'
          pytest -q
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  required:
    name: required
    if: always()
    needs: [classify, secret-scan, frontend, worker, supabase]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce all selected gates
        shell: bash
        run: |
          set -euo pipefail
          for result in \
            "${{ needs.classify.result }}" \
            "${{ needs.secret-scan.result }}" \
            "${{ needs.frontend.result }}" \
            "${{ needs.worker.result }}" \
            "${{ needs.supabase.result }}"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Required gate failed with result: $result"
              exit 1
            fi
          done
          echo "P0 Required Gate passed"
