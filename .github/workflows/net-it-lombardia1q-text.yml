name: NET-IT-LOMBARDIA1Q textual locality audit
on:
  push:
    branches: ["net-it-lombardia1q-text-audit-20261126"]
    paths:
      - ".github/workflows/net-it-lombardia1q-text.yml"
permissions:
  contents: write
jobs:
  geo:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: net-it-lombardia1q-text-audit-20261126
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install worker
        working-directory: services/worker
        run: python -m pip install .
      - name: Extract minimal first-party address evidence
        working-directory: services/worker
        run: python -m scripts.lombardia1q_text_audit
      - name: Save observations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/worker/audits/net_it_lombardia1q_text_results.csv
          if ! git diff --cached --quiet; then
            git commit -m "audit(LOMBARDIA1.Q): literal address evidence [skip ci]"
            git push origin HEAD:refs/heads/net-it-lombardia1q-text-audit-20261126
          fi
