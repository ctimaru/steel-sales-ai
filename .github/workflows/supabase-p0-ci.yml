name: Supabase P0 Foundation CI (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p0-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Inject CI-only historical baselines
        run: |
          cp supabase/ci/p0_pre_worker_baseline.sql supabase/migrations/20260908000000_ci_pre_worker_baseline.sql
          cp supabase/ci/p0_staging_baseline.sql supabase/migrations/20260908000001_ci_staging_baseline.sql
      - run: supabase start
      - run: supabase db reset --local
      - name: Run P0 acceptance suite
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          for test in \
            p0_tenant_isolation.sql \
            p0_steel_ontology.sql \
            p0_parser_contract_v4.sql \
            p0_entity_resolution.sql \
            p0_observability.sql \
            p0_data_lifecycle.sql; do
            psql --host 127.0.0.1 --port 54322 --username postgres --dbname postgres \
              --set ON_ERROR_STOP=1 --file "supabase/tests/$test"
          done
      - name: Verify tenant helper and lint
        env:
          PGPASSWORD: postgres
        run: |
          psql --host 127.0.0.1 --port 54322 --username postgres --dbname postgres \
            --set ON_ERROR_STOP=1 --command "select public.default_organization_for_user(null::uuid);"
          supabase db lint --local --level warning
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/worker/pyproject.toml
      - name: Run worker/RAG regression suite
        working-directory: services/worker
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[test]'
          pytest -q
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup
