name: "NET-IT-MASS8 — steel supplier/manufacturer discovery"

on:
  push:
    branches: ["net-it-mass8-20261120"]
    paths:
      - ".github/workflows/net-it-mass8-overture.yml"
      - "services/worker/scripts/overture15_mass8.py"

permissions:
  contents: write

concurrency:
  group: net-it-mass8-20261120-readonly
  cancel-in-progress: false

jobs:
  read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Overture query engine
        run: python -m pip install "duckdb>=1.4,<2"
      - name: Read licensed industrial website pointers
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: python services/worker/scripts/overture15_mass8.py
      - name: Store provenance CSV on isolated branch
        if: github.ref == 'refs/heads/net-it-mass8-20261120'
        run: |
          set -euo pipefail
          audit="services/worker/audits/net_it_mass8_20261120_gers.csv"
          test -s "$audit"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$audit"
          if git diff --cached --quiet; then exit 0; fi
          test "$(git diff --cached --name-only)" = "$audit"
          git commit -m "audit(network): MASS8 Overture industrial website pointers"
          git push origin HEAD:refs/heads/net-it-mass8-20261120
