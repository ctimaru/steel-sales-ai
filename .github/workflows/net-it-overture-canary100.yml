name: "NET-IT-FAST1 — Overture canary100 read-only"
on:
  push:
    branches: ["net-it-overture-canary20-20261117"]
    paths:
      - ".github/workflows/net-it-overture-canary100.yml"
      - "services/worker/scripts/overture_canary100.py"
permissions:
  contents: read
concurrency:
  group: net-it-overture100-readonly
  cancel-in-progress: false
jobs:
  overture-100:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free embedded query engine
        run: python -m pip install "duckdb>=1.4,<2"
      - name: Read-only licensed Overture Places website lead canary
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: python services/worker/scripts/overture_canary100.py
