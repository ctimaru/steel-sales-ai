name: SEC1 Public RPC Privilege Boundary / Local Acceptance

on:
  pull_request:
    paths:
      - "supabase/migrations/20261009140500_sec1_public_rpc_privilege_boundary.sql"
      - "supabase/tests/sec1_public_rpc_boundary.sql"
      - ".github/workflows/sec1-public-rpc-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-boundary:
    name: SEC1 fail-closed anon RPC and published API compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Create local-only historical baseline migrations
        run: |
          cp supabase/ci/p0_pre_worker_baseline.sql supabase/migrations/20260908000000_ci_pre_worker_baseline.sql
          cp supabase/ci/p0_staging_baseline.sql supabase/migrations/20260908000001_ci_staging_baseline.sql
      - name: Start throwaway Auth, REST and Postgres
        run: supabase start
      - name: Apply complete migrations to local-only database
        run: supabase db reset --local
      - name: Security contract as actual anon role (ROLLBACK)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/sec1_public_rpc_boundary.sql
      - name: Destroy local stack without backups or retained fixture data
        if: always()
        run: supabase stop --no-backup
