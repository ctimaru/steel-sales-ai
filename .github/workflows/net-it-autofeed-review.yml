name: NET-IT-AUTOFEED database review
on:
  pull_request:
    paths:
      - 'docs/net-it-autofeed1-atomic-intake-review.sql'
      - 'docs/net-it-lombardia1c-review.sql'
      - 'docs/net-it-lombardia1i-review.sql'
      - 'docs/net-it-lombardia1o-retry-review.sql'
      - 'supabase/migrations/*_net_it_lombardia1o_retry.sql'
      - 'supabase/migrations/*_net_it_lombardia1i.sql'
      - 'supabase/migrations/*_net_it_lombardia1c.sql'
      - 'supabase/migrations/*_net_it_autofeed_atomic_intake.sql'
      - 'services/worker/tests/sql/autofeed_*.sql'
      - '.github/workflows/net-it-autofeed-review.yml'
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_test_only
          POSTGRES_DB: autofeed_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test SQL in isolated disposable PostgreSQL
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: local_test_only
          PGDATABASE: autofeed_test
        run: |
          set -euo pipefail
          psql -X -v ON_ERROR_STOP=1 -f services/worker/tests/sql/autofeed_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/net-it-autofeed1-atomic-intake-review.sql
          psql -X -v ON_ERROR_STOP=1 -f services/worker/tests/sql/autofeed_acceptance.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/net-it-lombardia1c-review.sql
          psql -X -v ON_ERROR_STOP=1 -f services/worker/tests/sql/autofeed_lombardia_acceptance.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/net-it-lombardia1i-review.sql
          psql -X -v ON_ERROR_STOP=1 -f services/worker/tests/sql/autofeed_lombardia_successor_acceptance.sql
          psql -X -v ON_ERROR_STOP=1 -f services/worker/tests/sql/autofeed_lombardia_retry_fixture.sql
          psql -X -v ON_ERROR_STOP=1 -f docs/net-it-lombardia1o-retry-review.sql
          psql -X -v ON_ERROR_STOP=1 -f services/worker/tests/sql/autofeed_lombardia_retry_acceptance.sql
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Generate or verify local release migration
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase migration new --help
          shopt -s nullglob
          files=(supabase/migrations/*_net_it_autofeed_atomic_intake.sql)
          test ${#files[@]} -le 1
          sed '1c\-- AUTOFEED atomic intake and persistent audit cursor; no source or policy created.' docs/net-it-autofeed1-atomic-intake-review.sql > /tmp/autofeed-release.sql
          if [ ${#files[@]} -eq 0 ]; then
            supabase migration new net_it_autofeed_atomic_intake
            files=(supabase/migrations/*_net_it_autofeed_atomic_intake.sql)
            test ${#files[@]} -eq 1
            cp /tmp/autofeed-release.sql "${files[0]}"
          fi
          test ${#files[@]} -eq 1
          cmp /tmp/autofeed-release.sql "${files[0]}"
          printf 'AUTOFEED_MIGRATION_PATH=%s\n' "${files[0]}"
          sha256sum "${files[0]}"
      - name: Generate or verify Lombardia migration
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/migrations/*_net_it_lombardia1c.sql)
          test ${#files[@]} -le 1
          if [ ${#files[@]} -eq 0 ]; then
            supabase migration new net_it_lombardia1c
            files=(supabase/migrations/*_net_it_lombardia1c.sql)
            test ${#files[@]} -eq 1
            cp docs/net-it-lombardia1c-review.sql "${files[0]}"
          fi
          test ${#files[@]} -eq 1
          cmp docs/net-it-lombardia1c-review.sql "${files[0]}"
          printf 'LOMBARDIA_MIGRATION_PATH=%s\n' "${files[0]}"
          sha256sum "${files[0]}"
      - name: Generate or verify successor migration
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/migrations/*_net_it_lombardia1i.sql)
          test ${#files[@]} -le 1
          if [ ${#files[@]} -eq 0 ]; then
            supabase migration new net_it_lombardia1i
            files=(supabase/migrations/*_net_it_lombardia1i.sql)
            test ${#files[@]} -eq 1
            cp docs/net-it-lombardia1i-review.sql "${files[0]}"
          fi
          test ${#files[@]} -eq 1
          cmp docs/net-it-lombardia1i-review.sql "${files[0]}"
          printf 'SUCCESSOR_MIGRATION_PATH=%s\n' "${files[0]}"
          sha256sum "${files[0]}"
      - name: Generate or verify retry migration
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(supabase/migrations/*_net_it_lombardia1o_retry.sql)
          test ${#files[@]} -le 1
          if [ ${#files[@]} -eq 0 ]; then
            supabase migration new net_it_lombardia1o_retry
            files=(supabase/migrations/*_net_it_lombardia1o_retry.sql)
            test ${#files[@]} -eq 1
            cp docs/net-it-lombardia1o-retry-review.sql "${files[0]}"
          fi
          test ${#files[@]} -eq 1
          cmp docs/net-it-lombardia1o-retry-review.sql "${files[0]}"
          printf 'RETRY_MIGRATION_PATH=%s\n' "${files[0]}"
          sha256sum "${files[0]}"
