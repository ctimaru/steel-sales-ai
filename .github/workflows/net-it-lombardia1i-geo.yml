name: NET-IT-LOMBARDIA1I first-party locality audit
on:
  push:
    branches: ["net-it-lombardia1i-geo-audit-20261126"]
    paths:
      - ".github/workflows/net-it-lombardia1i-geo.yml"
      - "services/worker/scripts/lombardia1i_geo_audit.py"
permissions:
  contents: write
jobs:
  geo:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: net-it-lombardia1i-geo-audit-20261126
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing worker
        working-directory: services/worker
        run: python -m pip install .
      - name: Collect locality signals without production writes
        working-directory: services/worker
        run: python -m scripts.lombardia1i_geo_audit
      - name: Preserve minimal observation audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/worker/audits/net_it_lombardia1i_geo_observations.csv
          if ! git diff --cached --quiet; then
            git commit -m "audit(LOMBARDIA1.I): first-party locality signals [skip ci]"
            git push origin HEAD:refs/heads/net-it-lombardia1i-geo-audit-20261126
          fi
