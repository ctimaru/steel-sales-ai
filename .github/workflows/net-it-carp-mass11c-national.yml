name: "NET-IT-CARP-MASS11C — province search tile discovery (read-only)"
on:
  push:
    branches: ["net-it-carp-mass11-national-20261123"]
    paths:
      - ".github/workflows/net-it-carp-mass11c-national.yml"
      - "services/worker/scripts/overture_carp_mass11c_national.py"
permissions:
  contents: write
concurrency:
  group: net-it-carp-mass11c-audit
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: net-it-carp-mass11-national-20261123
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public dataset query engine
        run: python -m pip install "duckdb>=1.4,<2"
      - name: Search new source-licensed Overture website pointers
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: python services/worker/scripts/overture_carp_mass11c_national.py
      - name: Preserve versioned GERS audit separately from MASS11 A/B
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/worker/audits/net_it_carp_mass11c_20261123_gers.csv
          if ! git diff --cached --quiet; then
            git commit -m "audit(MASS11C): retain licensed province-tile GERS pointers [skip ci]"
            git pull --rebase origin net-it-carp-mass11-national-20261123
            git push origin HEAD:refs/heads/net-it-carp-mass11-national-20261123
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: net-it-carp-mass11c-20261123-gers
          path: services/worker/audits/net_it_carp_mass11c_20261123_gers.csv
          if-no-files-found: error
