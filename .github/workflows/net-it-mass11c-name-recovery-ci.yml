name: NET-IT-MASS11C first-party name recovery tests
on:
  push:
    branches: [feat/net-it-mass11c-name-recovery-20261123]
    paths:
      - ".github/workflows/net-it-mass11c-name-recovery-ci.yml"
      - "services/worker/app/net_it_identity_extract.py"
      - "services/worker/app/net_it_auto2_reviewer.py"
      - "services/worker/tests/test_net_it_mass11c_name_recovery.py"
jobs:
  firstparty-name-regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/worker/pyproject.toml
      - name: Install worker test dependencies
        run: python -m pip install -e "./services/worker[test]"
      - name: Run narrow AUTO2 legal-name regression suite
        run: |
          cd services/worker
          python -m pytest -q tests/test_net_it_mass11c_name_recovery.py tests/test_net_it_identity_extract.py tests/test_net_it_auto2_reviewer.py
