name: "CRAWL-IT6.10b.4 — Candidate Gate Acceptance"
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: services/worker
        run: python -m pip install -e .
      - name: Read-only governed link acceptance
        working-directory: services/worker
        env:
          CRAWL_IT68_SUPABASE_URL: ${{ vars.CRAWL_IT68_SUPABASE_URL }}
          CRAWL_IT68_SUPABASE_SECRET_KEY: ${{ secrets.CRAWL_IT68_SUPABASE_SECRET_KEY }}
        run: python -m app.crawl_it610b4_acceptance
