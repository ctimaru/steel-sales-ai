name: "NET-IT-OVERTURE4 — free wider national source canary"
on:
  push:
    branches: ["net-it-overture3-yield-focus-20261118"]
    paths:
      - ".github/workflows/net-it-overture4-national-next.yml"
      - "services/worker/scripts/overture4_national_next.py"
permissions:
  contents: read
concurrency:
  group: net-it-overture4-readonly-source
  cancel-in-progress: false
jobs:
  national-next-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install open-source query engine
        run: python -m pip install "duckdb>=1.4,<2"
      - name: Read-only Overture Places seven-area industrial leads
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: python services/worker/scripts/overture4_national_next.py
