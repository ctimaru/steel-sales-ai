name: "CRAWL-IT6.6c — MIMIT RNA Corporate Candidate Preview"

on:
  workflow_dispatch:
    inputs:
      official_xml_url:
        description: "Exact download URL copied from MIMIT RNA Open Data (www.rna.gov.it/.../OpenData_Aiuti_YYYY_MM.xml)"
        type: string
        required: true
      segment:
        description: "Potential company segment inferred only from aid-component NACE hint"
        type: choice
        default: trader
        required: true
        options: [trader, buyer, both]
      max_candidates:
        description: "Maximum unique legal entities in private review CSV"
        type: choice
        required: true
        default: "200"
        options: ["100", "200", "300"]

permissions:
  contents: read

concurrency:
  group: crawl-it66c-rna-preview
  cancel-in-progress: false

jobs:
  rna-preview:
    if: github.ref == 'refs/heads/main'
    name: "Read-only official XML -> corporate CSV artifact"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Install existing public worker dependencies"
        working-directory: services/worker
        run: python -m pip install -e .
      - name: "Official public XML, corporate-only output, no database credentials"
        working-directory: services/worker
        env:
          RNA_XML_URL: ${{ inputs.official_xml_url }}
          TARGET_SEGMENT: ${{ inputs.segment }}
          MAX_CANDIDATES: ${{ inputs.max_candidates }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          case "$MAX_CANDIDATES" in 100|200|300) ;; *) exit 2 ;; esac
          case "$TARGET_SEGMENT" in trader|buyer|both) ;; *) exit 2 ;; esac
          python -m app.rna_corporate_candidates \
            --dataset-url "$RNA_XML_URL" --segment "$TARGET_SEGMENT" \
            --limit "$MAX_CANDIDATES" \
            --output "$RUNNER_TEMP_DIR/it66c-rna-candidate-proposals.csv"
      - name: "Store operator-only preview for controlled source review"
        uses: actions/upload-artifact@v4
        with:
          name: it66c-rna-candidates-unverified
          path: ${{ runner.temp }}/it66c-rna-candidate-proposals.csv
          if-no-files-found: error
          retention-days: 3
