name: "CRAWL-IT6.6c — MIMIT RNA Corporate Candidate Preview"

on:
  workflow_dispatch:
    inputs:
      official_xml_url:
        description: "Exact MIMIT XML URL (OpenData_Aiuti_YYYY_MM, optional .xml); summary only"
        type: string
        required: true
      segment:
        description: "Potential company segment inferred only from aid-component NACE hint"
        type: choice
        default: trader
        required: true
        options: [trader, buyer, both]
      max_candidates:
        description: "Maximum distinct corporate entities counted in public-safe summary"
        type: choice
        required: true
        default: "200"
        options: ["100", "200", "300"]

permissions:
  contents: read

concurrency:
  group: crawl-it66c-rna-preview
  cancel-in-progress: false

jobs:
  rna-preview:
    if: github.ref == 'refs/heads/main'
    name: "Read-only official XML -> aggregate corporate candidate counts"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Install existing public worker dependencies"
        working-directory: services/worker
        run: python -m pip install -e .
      - name: "Official public XML, aggregate counts only, no database credentials"
        working-directory: services/worker
        env:
          RNA_XML_URL: ${{ inputs.official_xml_url }}
          TARGET_SEGMENT: ${{ inputs.segment }}
          MAX_CANDIDATES: ${{ inputs.max_candidates }}
        run: |
          set -euo pipefail
          case "$MAX_CANDIDATES" in 100|200|300) ;; *) exit 2 ;; esac
          case "$TARGET_SEGMENT" in trader|buyer|both) ;; *) exit 2 ;; esac
          python -m app.rna_corporate_candidates \
            --dataset-url "$RNA_XML_URL" --segment "$TARGET_SEGMENT" \
            --limit "$MAX_CANDIDATES" \
            --summary-only
