name: Worker CI

on:
  pull_request:
    paths:
      - "services/worker/**"
      - ".github/workflows/worker-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/worker/**"
      - ".github/workflows/worker-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[test]'
      - run: pytest -q
