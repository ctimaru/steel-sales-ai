name: "NET-GROWTH3.C — 50 Italian Steel Traders (review gated)"

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Import ONLY when all 50 first-party source holds are cleared (default: no write)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: net-growth3c-italian-traders
  cancel-in-progress: false

jobs:
  acquire:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install approved worker
        working-directory: services/worker
        run: python -m pip install -e '.[test]'
      - name: Source format and source holds — offline, no secrets
        working-directory: services/worker
        run: |
          python -m pytest -q tests/test_netgrowth3c_firstparty_batch.py
          python -m app.netgrowth3c_firstparty_batch --dry-run
      - name: Complete cross-source read-only production preflight
        working-directory: services/worker
        env:
          CRAWL_IT65B_SUPABASE_URL: ${{ vars.CRAWL_IT65B_SUPABASE_URL }}
          CRAWL_IT65B_SUPABASE_SECRET_KEY: ${{ secrets.CRAWL_IT65B_SUPABASE_SECRET_KEY }}
        run: |
          test "$CRAWL_IT65B_SUPABASE_URL" = "https://ecrafjdummcdfycznitx.supabase.co" || exit 1
          case "$CRAWL_IT65B_SUPABASE_SECRET_KEY" in sb_secret_*) ;; *) exit 1;; esac
          echo "::add-mask::$CRAWL_IT65B_SUPABASE_SECRET_KEY"
          python -m app.netgrowth3c_firstparty_batch --preflight
      - name: Explicit service-only import — source sign-off mandatory
        if: ${{ inputs.apply == true }}
        working-directory: services/worker
        env:
          CRAWL_IT65B_SUPABASE_URL: ${{ vars.CRAWL_IT65B_SUPABASE_URL }}
          CRAWL_IT65B_SUPABASE_SECRET_KEY: ${{ secrets.CRAWL_IT65B_SUPABASE_SECRET_KEY }}
        run: |
          test "$CRAWL_IT65B_SUPABASE_URL" = "https://ecrafjdummcdfycznitx.supabase.co" || exit 1
          case "$CRAWL_IT65B_SUPABASE_SECRET_KEY" in sb_secret_*) ;; *) exit 1;; esac
          echo "::add-mask::$CRAWL_IT65B_SUPABASE_SECRET_KEY"
          python -m app.netgrowth3c_firstparty_batch --apply
