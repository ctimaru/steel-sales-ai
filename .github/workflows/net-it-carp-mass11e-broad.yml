name: "NET-IT-CARP-MASS11E — nationwide metal-supplier and machine-shop audit"
on:
  push:
    branches: ["net-it-carp-mass11e-broad-20261123"]
    paths:
      - ".github/workflows/net-it-carp-mass11e-broad.yml"
      - "services/worker/scripts/overture_carp_mass11e_broad.py"
permissions:
  contents: write
concurrency:
  group: net-it-carp-mass11e-audit
  cancel-in-progress: false
jobs:
  overture-expanded-industrial:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout isolated discovery branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: net-it-carp-mass11e-broad-20261123
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source-query engine
        run: python -m pip install "duckdb>=1.4,<2"
      - name: Scan official website pointers, no production writes
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: python services/worker/scripts/overture_carp_mass11e_broad.py
      - name: Preserve first-party website pointer provenance on discovery branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/worker/audits/net_it_carp_mass11e_20261123_gers.csv
          if ! git diff --cached --quiet; then
            git commit -m "audit(MASS11E): CDLA Overture website pointer provenance [skip ci]"
            git push origin HEAD:refs/heads/net-it-carp-mass11e-broad-20261123
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: net-it-carp-mass11e-20261123-gers
          path: services/worker/audits/net_it_carp_mass11e_20261123_gers.csv
          if-no-files-found: error
