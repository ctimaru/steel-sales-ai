name: "NET-GROWTH3.B — Italian First-party Traders (manual only)"

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Publish 25 sourced trader candidates as UNCONFIRMED only (false = offline dry-run)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: net-growth3b-traders-20261104
  cancel-in-progress: false

jobs:
  acquire:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validated worker package
        working-directory: services/worker
        run: python -m pip install -e .
      - name: Mandatory offline source + domain + role preflight
        working-directory: services/worker
        run: python -m app.netgrowth3b_firstparty_batch --dry-run
      - name: Explicit manual write — service-only, 25 first-party provisional listings
        if: ${{ inputs.apply == true }}
        working-directory: services/worker
        env:
          CRAWL_IT65B_SUPABASE_URL: ${{ vars.CRAWL_IT65B_SUPABASE_URL }}
          CRAWL_IT65B_SUPABASE_SECRET_KEY: ${{ secrets.CRAWL_IT65B_SUPABASE_SECRET_KEY }}
        run: |
          test "$CRAWL_IT65B_SUPABASE_URL" = "https://ecrafjdummcdfycznitx.supabase.co" || exit 1
          case "$CRAWL_IT65B_SUPABASE_SECRET_KEY" in sb_secret_*) ;; *) exit 1;; esac
          echo "::add-mask::$CRAWL_IT65B_SUPABASE_SECRET_KEY"
          python -m app.netgrowth3b_firstparty_batch --apply
