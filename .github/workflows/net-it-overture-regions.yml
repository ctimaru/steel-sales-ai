name: "NET-IT-CARP-MASS1 — Overture carpenterie 7 aree (read-only)"
on:
  push:
    branches: ["net-it-carp-mass1-20261119"]
    paths:
      - ".github/workflows/net-it-overture-regions.yml"
      - "services/worker/scripts/overture_regions_canary.py"
permissions:
  contents: read
concurrency:
  group: net-it-carp-mass1-regions-readonly
  cancel-in-progress: false
jobs:
  regions-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free open-source embedded SQL engine
        run: python -m pip install "duckdb>=1.4,<2"
      - name: Probe official Overture Places in 7 macro-areas without credentials or writes
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: python services/worker/scripts/overture_regions_canary.py
