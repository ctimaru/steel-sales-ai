name: "NET-IT-FAST1 — Overture Italy regional read-only pilot"
on:
  push:
    branches: ["net-it-overture-canary20-20261117"]
    paths:
      - ".github/workflows/net-it-overture-regions.yml"
      - "services/worker/scripts/overture_regions_canary.py"
permissions:
  contents: read
concurrency:
  group: net-it-overture-regions-readonly
  cancel-in-progress: false
jobs:
  regions-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free open-source embedded SQL engine
        run: python -m pip install "duckdb>=1.4,<2"
      - name: Probe official Overture Places in 7 macro-areas without credentials or writes
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: python services/worker/scripts/overture_regions_canary.py
