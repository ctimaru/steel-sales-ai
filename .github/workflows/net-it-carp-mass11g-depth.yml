name: "NET-IT-CARP-MASS11G — licensed carpenteria deeper website discovery"
on:
  push:
    branches: ["net-it-carp-mass11g-depth-20261123"]
    paths:
      - ".github/workflows/net-it-carp-mass11g-depth.yml"
      - "services/worker/scripts/overture_carp_mass11g_depth.py"
permissions:
  contents: write
concurrency:
  group: net-it-carp-mass11g-depth
  cancel-in-progress: false
jobs:
  metalwork-overture:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout isolated discovery branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: net-it-carp-mass11g-depth-20261123
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Overture reader
        run: python -m pip install "duckdb>=1.4,<2"
      - name: Read licensed Overture metal fabricator site pointers (NO production writes)
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: python services/worker/scripts/overture_carp_mass11g_depth.py
      - name: Record licensed website pointer audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/worker/audits/net_it_carp_mass11g_20261123_gers.csv
          if ! git diff --cached --quiet; then
            git commit -m "audit(MASS11G): Overture GERS provenance for national metalwork sites [skip ci]"
            git push origin HEAD:refs/heads/net-it-carp-mass11g-depth-20261123
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: net-it-carp-mass11g-20261123-gers
          path: services/worker/audits/net_it_carp_mass11g_20261123_gers.csv
          if-no-files-found: error
