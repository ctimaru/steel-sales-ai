name: NET-IT-LOMBARDIA1M bounded recovery audit
on:
  push:
    branches: ["net-it-lombardia1m-recovery-20261126"]
    paths:
      - ".github/workflows/net-it-lombardia1m-recovery.yml"
      - "services/worker/scripts/lombardia1m_recovery.py"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: net-it-lombardia1m-recovery-20261126
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing worker
        working-directory: services/worker
        run: python -m pip install .
      - name: Recheck first-party access and classify failures
        working-directory: services/worker
        run: python -m scripts.lombardia1m_recovery
      - name: Save diagnostic results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/worker/audits/net_it_lombardia1m_recovery_results.csv
          if ! git diff --cached --quiet; then
            git commit -m "audit(LOMBARDIA1.M): recovery diagnostics [skip ci]"
            git push origin HEAD:refs/heads/net-it-lombardia1m-recovery-20261126
          fi
