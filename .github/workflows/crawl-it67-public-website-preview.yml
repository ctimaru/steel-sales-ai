name: "CRAWL-IT6.7 — Public Company Website Preview"

on:
  workflow_dispatch:
    inputs:
      website_urls:
        description: "1–5 approved HTTPS corporate sites, comma-separated. No directories."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: crawl-it67-website-preview
  cancel-in-progress: false

jobs:
  website-preview:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Install worker"
        working-directory: services/worker
        run: python -m pip install -e .
      - name: "Read-only robots-aware corporate website preview (aggregate only)"
        working-directory: services/worker
        env:
          WEBSITE_URLS: ${{ inputs.website_urls }}
        run: python -m app.public_website_preview --urls "$WEBSITE_URLS"
