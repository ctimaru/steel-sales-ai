name: "NET-IT — industrial taxonomy probe"

on:
  push:
    branches: ["net-it-taxonomy-probe-20261120"]
    paths:
      - ".github/workflows/net-it-taxonomy-probe.yml"
      - "services/worker/scripts/overture17_taxonomy_probe.py"

permissions:
  contents: read

concurrency:
  group: net-it-taxonomy-probe-20261120
  cancel-in-progress: false

jobs:
  read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free Overture query engine
        run: python -m pip install "duckdb>=1.4,<2"
      - name: Aggregate Italian industrial taxonomy only
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: python services/worker/scripts/overture17_taxonomy_probe.py
