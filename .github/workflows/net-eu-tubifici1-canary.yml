name: "NET-EU-TUBIFICI1.D1 — Bounded European cohort identity canary"

# D1 second cohort: the existing worker will use the source-bound queue
# for 8 new European producer candidates (batch 02). No publisher is invoked.
# This file change intentionally schedules a one-time canary on merge to main;
# subsequent pushes do not retrigger unless this workflow file changes again.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/net-eu-tubifici1-canary.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: net-eu-tubifici1-d1-live-canary
  cancel-in-progress: false

jobs:
  first-party-canary:
    if: github.ref == 'refs/heads/main'
    name: "Inspect up to 8 EU producer candidates, evidence only"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install established worker dependencies
        working-directory: services/worker
        run: python -m pip install -e .
      - name: Validate server-only Supabase configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing project worker secrets; no EU records processed"
            exit 1
          fi
      - name: Real D1 8-domain canary — store first-party identity evidence only
        working-directory: services/worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          python -m app.net_eu_tubifici1_reviewer --limit 8 --persist
          # This worker never publishes records or confirms tube manufacturing.
