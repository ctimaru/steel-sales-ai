name: "NET-EU-TUBIFICI1.B2 — One-time European identity canary"

# Purpose: run the freshly merged, bounded European identity reviewer against
# the 19 already-staged EU company domains. This is evidence-only, NOT a
# manufacturer certification or publication route.
# The first push introducing this file to main triggers one run; subsequent
# pushes do not, unless this workflow file itself is edited. Manual reruns
# require workflow_dispatch on main.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/net-eu-tubifici1-canary.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: net-eu-tubifici1-b2-live-canary
  cancel-in-progress: false

jobs:
  first-party-canary:
    if: github.ref == 'refs/heads/main'
    name: "Inspect up to 19 EU manufacturers without publishing"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install established worker dependencies
        working-directory: services/worker
        run: python -m pip install -e .
      - name: Validate server-only Supabase configuration
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing project worker secrets; no EU records processed"
            exit 1
          fi
      - name: Real 19-domain canary — record first-party identity observations only
        working-directory: services/worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          python -m app.net_eu_tubifici1_reviewer --limit 19 --persist
          # This worker never publishes records or confirms tube manufacturing.
