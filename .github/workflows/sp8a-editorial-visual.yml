name: SP8.A — Authenticated Editorial Studio Visual Acceptance
on:
  pull_request:
    paths:
      - "apps/web/app/**/platform/steel-pulse/**"
      - "apps/web/tests/sp8a-*.mjs"
      - "apps/web/tests/sp8b-*.mjs"
      - "supabase/tests/sp8a_*.sql"
      - "supabase/tests/sp8b_*.sql"
      - ".github/workflows/sp8a-editorial-visual.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual:
    name: Chrome authenticated owner / 1440, 390, 320 / local only
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      SP8A_WEB_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      RESEND_API_KEY: ""
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Prepare CI-only historical database baselines
        run: |
          cp supabase/ci/p0_pre_worker_baseline.sql supabase/migrations/20260908000000_ci_pre_worker_baseline.sql
          cp supabase/ci/p0_staging_baseline.sql supabase/migrations/20260908000001_ci_staging_baseline.sql
      - name: Start local disposable Supabase
        run: |
          supabase start
          supabase db reset --local
      - name: Collect local keys without printing
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          supabase status -o env > "$RUNNER_TEMP/sp8a-local.env"
          source "$RUNNER_TEMP/sp8a-local.env"
          test -n "$ANON_KEY"
          test -n "$SERVICE_ROLE_KEY"
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
      - name: Install local Next.js and Chrome
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chrome
      - name: Create two synthetic real-GoTrue users (local only)
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/sp8a-local.env"
          SP8A_LOCAL_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" SUPABASE_URL=http://127.0.0.1:54321 \
            node tests/sp8a-seed-auth.mjs
      - name: Seed owner and one unapproved editorial item in LOCAL database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 \
            -f "$RUNNER_TEMP/sp8a-vars.sql" \
            -f supabase/tests/sp8a_editorial_visual_seed.sql
      - name: Start local Next.js on 127.0.0.1
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          nohup npm run dev -- --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/sp8a-next.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/sp8a-next.pid"
          for i in $(seq 1 65); do
            if curl --silent --fail --location --max-time 8 http://127.0.0.1:3000/login > /dev/null 2>&1; then
              exit 0
            fi
            sleep 3
          done
          tail -n 80 "$RUNNER_TEMP/sp8a-next.log"
          exit 1
      - name: Chrome owner/non-owner + desktop/mobile screenshots
        timeout-minutes: 10
        working-directory: apps/web
        run: node tests/sp8a-editorial-visual-chrome.mjs
      - name: Seed two distinct editorial identities and non-publishable approved LOCAL source
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 \
            -f "$RUNNER_TEMP/sp8a-vars.sql" \
            -f supabase/tests/sp8b_editorial_journey_seed.sql
      - name: SP8.B real GoTrue author and independent reviewer journey
        timeout-minutes: 10
        working-directory: apps/web
        run: node tests/sp8b-editorial-journey-chrome.mjs
      - name: Upload synthetic-only UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sp8a-editorial-synthetic-1440-390-320
          path: ${{ runner.temp }}/sp8a-visual-evidence/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop local Next.js and destroy temporary Supabase
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/sp8a-next.pid" ]; then kill "$(cat "$RUNNER_TEMP/sp8a-next.pid")" || true; fi
          supabase stop --no-backup || true
          rm -f "$RUNNER_TEMP/sp8a-users.json" "$RUNNER_TEMP/sp8a-vars.sql" "$RUNNER_TEMP/sp8a-local.env"
