name: "NET-IT-CARP-MASS11 — national carpenteria Overture discovery (read-only)"
on:
  push:
    branches: ["net-it-carp-mass11-national-20261123"]
    paths:
      - ".github/workflows/net-it-carp-mass11-national.yml"
      - "services/worker/scripts/overture_carp_mass11_national.py"
permissions:
  contents: write
concurrency:
  group: net-it-carp-mass11-national-audit
  cancel-in-progress: false
jobs:
  overture-carp-national:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout isolated discovery branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: net-it-carp-mass11-national-20261123
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free Overture query engine
        run: python -m pip install "duckdb>=1.4,<2"
      - name: Collect source-licensed website pointers only
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: python services/worker/scripts/overture_carp_mass11_national.py
      - name: Retain GERS/license audit on the isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/worker/audits/net_it_carp_mass11_20261123_gers.csv
          if ! git diff --cached --quiet; then
            git commit -m "audit(MASS11): retain Overture GERS provenance [skip ci]"
            git push origin HEAD:refs/heads/net-it-carp-mass11-national-20261123
          fi
      - name: Upload GERS audit for dedup
        uses: actions/upload-artifact@v4
        with:
          name: net-it-carp-mass11-20261123-gers
          path: services/worker/audits/net_it_carp_mass11_20261123_gers.csv
          if-no-files-found: error
