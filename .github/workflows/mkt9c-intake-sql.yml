name: MKT9C Community Intake SQL Fixture
on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/marketing/mkt9c-community-interest-schema.candidate.sql'
      - 'docs/marketing/mkt9c-retention-purge.candidate.sql'
      - 'supabase/tests/mkt9c-community-interest-fixture.sql'
      - '.github/workflows/mkt9c-intake-sql.yml'
      - 'supabase/tests/mkt9c-local-auth-fixture.sql'
      - 'apps/web/tests/mkt9-community-interest-local-auth.mjs'
      - 'apps/web/tests/mkt9-community-interest-e2e.mjs'
      - 'apps/web/lib/community-intake-actions.ts'
      - 'apps/web/lib/community-intake-db.ts'
      - 'apps/web/lib/community-intake-config.ts'
      - 'apps/web/package.json'
      - 'apps/web/package-lock.json'
      - 'docs/marketing/mkt9c-minimum-privilege.candidate.sql'
      - 'docs/marketing/mkt9c-retire-service-writer.candidate.sql'
      - 'apps/web/components/community-interest-page.tsx'
      - 'apps/web/components/community-interest-inbox.tsx'
permissions:
  contents: read
jobs:
  fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fixture-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Execute candidate SQL with synthetic data and isolated roles
        env:
          PGPASSWORD: fixture-only
        run: psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/mkt9c-community-interest-fixture.sql
  local-auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: supabase/setup-cli@v1
        with:
          version: "3.3.0"
      - run: npm ci --no-audit --no-fund
        working-directory: apps/web
      - name: Initialize disposable local Supabase project
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mkt9-local"
          cd "$RUNNER_TEMP/mkt9-local"
          supabase --version
          supabase init
          supabase migration new mkt9_local_auth_fixture
          cp "$GITHUB_WORKSPACE/supabase/tests/mkt9c-local-auth-fixture.sql" supabase/migrations/*_mkt9_local_auth_fixture.sql
          # CLI uses second-resolution migration timestamps; avoid collisions.
          sleep 2
          supabase migration new mkt9_community_interest_candidate
          cp "$GITHUB_WORKSPACE/docs/marketing/mkt9c-community-interest-schema.candidate.sql" supabase/migrations/*_mkt9_community_interest_candidate.sql
          supabase start > "$RUNNER_TEMP/mkt9-start.log" 2>&1
          supabase status -o env > "$RUNNER_TEMP/mkt9-local.env"
          supabase migration list --local
      - name: Exercise Auth-issued JWTs through local API
        working-directory: apps/web
        run: |
          set -euo pipefail
          set -a
          source "$RUNNER_TEMP/mkt9-local.env"
          set +a
          node tests/mkt9-community-interest-local-auth.mjs
      - name: Switch disposable Supabase to the dedicated writer
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f docs/marketing/mkt9c-minimum-privilege.candidate.sql
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "alter role mkt9_intake_writer login password 'fixture-only-writer';"
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -f docs/marketing/mkt9c-retire-service-writer.candidate.sql
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "do \$test\$ begin if has_function_privilege('service_role','public.mkt9_confirm_email(uuid,text)','execute') or has_column_privilege('service_role','public.mkt9_community_interest','email','insert') then raise exception 'Legacy writer grant survived'; end if; end \$test\$;"
      - name: Install pinned Chromium test dependencies
        working-directory: apps/web
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser to application actions and local owner inbox
        working-directory: apps/web
        run: |
          set -euo pipefail
          set -a
          source "$RUNNER_TEMP/mkt9-local.env"
          set +a
          node tests/mkt9-community-interest-e2e.mjs
      - name: Export CLI-generated tested migration candidate
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mkt9-migration"
          cp "$RUNNER_TEMP"/mkt9-local/supabase/migrations/*_mkt9_community_interest_candidate.sql "$RUNNER_TEMP/mkt9-migration/"
          sha256sum "$RUNNER_TEMP"/mkt9-migration/*.sql
      - uses: actions/upload-artifact@v4
        with:
          name: mkt9c-cli-migration-candidate
          path: ${{ runner.temp }}/mkt9-migration/*.sql
          if-no-files-found: error
          retention-days: 7
      - name: Stop disposable stack
        if: always()
        run: |
          cd "$RUNNER_TEMP/mkt9-local" && supabase stop --no-backup >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/mkt9-local.env" "$RUNNER_TEMP/mkt9-start.log"

  turnstile-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Official public dummy keys against actual Siteverify endpoint
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const token='XXXX.DUMMY.TOKEN.XXXX';
          for (const [mode,expected,code] of [[1,true,null],[2,false,'invalid-input-response'],[3,false,'timeout-or-duplicate']]) {
            const secret=mode+'x'+'0'.repeat(31)+'AA';
            const res=await fetch('https://challenges.cloudflare.com/turnstile/v0/siteverify',{
              method:'POST',body:new URLSearchParams({secret,response:token}),signal:AbortSignal.timeout(10000)
            });
            assert.ok(res.ok);
            const data=await res.json();
            assert.equal(data.success,expected);
            if(code)assert.ok(data['error-codes']?.includes(code));
          }
          console.log('MKT9C6 real Siteverify dummy-key contract PASS (not production widget)');
          NODE
