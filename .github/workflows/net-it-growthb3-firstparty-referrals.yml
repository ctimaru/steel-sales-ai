name: "NET-IT-GROWTH.B3 — First-party industrial referrals"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/net-it-growthb3-firstparty-referrals.yml"
      - "services/worker/app/net_it_growthb3_firstparty_referrals.py"
  schedule:
    # After regional source discovery; first-party origins capped at 12/day.
    - cron: "43 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: net-it-growthb3-firstparty-source-discovery
  cancel-in-progress: false

jobs:
  discover:
    name: "First-party industrial ecosystem leads (unverified, no publication)"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing worker code
        working-directory: services/worker
        run: python -m pip install -e .
      - name: Require existing server-side scoped Supabase credentials
        env:
          CRAWL_IT65B_SUPABASE_URL: ${{ vars.CRAWL_IT65B_SUPABASE_URL }}
          CRAWL_IT65B_SUPABASE_SECRET_KEY: ${{ secrets.CRAWL_IT65B_SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail
          test "$CRAWL_IT65B_SUPABASE_URL" = "https://ecrafjdummcdfycznitx.supabase.co" || exit 1
          case "$CRAWL_IT65B_SUPABASE_SECRET_KEY" in sb_secret_*) ;; *) exit 1 ;; esac
          echo "::add-mask::$CRAWL_IT65B_SUPABASE_SECRET_KEY"
      - name: Walk bounded company-owned partner pages with robots/SSRF protection
        working-directory: services/worker
        env:
          CRAWL_IT65B_SUPABASE_URL: ${{ vars.CRAWL_IT65B_SUPABASE_URL }}
          CRAWL_IT65B_SUPABASE_SECRET_KEY: ${{ secrets.CRAWL_IT65B_SUPABASE_SECRET_KEY }}
        run: python -m app.net_it_growthb3_firstparty_referrals
