name: "CRAWL-IT6.8 — Governed Approved Source Staging"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Read-only preflight or governed staging"
        type: choice
        default: preflight
        options: [preflight, stage]
        required: true
      source_budget:
        type: choice
        description: "Max distinct due approved sources to claim (1-3; at most 20 leads each)"
        default: "1"
        options: ["1", "2", "3"]
        required: true
  schedule:
    - cron: "17 4 * * 2,5"

permissions:
  contents: read

concurrency:
  group: crawl-it68-approved-source-staging
  cancel-in-progress: false

jobs:
  stage:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' && inputs.mode == 'preflight') ||
       (vars.CRAWL_IT68_ENABLED == 'true' &&
        (github.event_name == 'schedule' ||
         (github.event_name == 'workflow_dispatch' && inputs.mode == 'stage'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Install worker"
        working-directory: services/worker
        run: python -m pip install -e .
      - name: "Validate deliberately configured service access"
        env:
          CRAWL_IT68_SUPABASE_URL: ${{ vars.CRAWL_IT68_SUPABASE_URL }}
          CRAWL_IT68_SUPABASE_SECRET_KEY: ${{ secrets.CRAWL_IT68_SUPABASE_SECRET_KEY }}
        run: |
          test -n "$CRAWL_IT68_SUPABASE_URL" && test -n "$CRAWL_IT68_SUPABASE_SECRET_KEY"
          echo "::add-mask::$CRAWL_IT68_SUPABASE_SECRET_KEY"
          test "${CRAWL_IT68_SUPABASE_URL}" = "https://ecrafjdummcdfycznitx.supabase.co"
          case "$CRAWL_IT68_SUPABASE_SECRET_KEY" in sb_secret_*) ;; *) echo "Dedicated Supabase secret key required"; exit 1;; esac
      - name: "Read-only credential and source preflight"
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'preflight'
        working-directory: services/worker
        env:
          CRAWL_IT68_SUPABASE_URL: ${{ vars.CRAWL_IT68_SUPABASE_URL }}
          CRAWL_IT68_SUPABASE_SECRET_KEY: ${{ secrets.CRAWL_IT68_SUPABASE_SECRET_KEY }}
        run: python -m app.crawl_it68_preflight
      - name: "Stage due rights-approved sources into review only"
        if: github.event_name == 'schedule' || inputs.mode == 'stage'
        working-directory: services/worker
        env:
          CRAWL_IT68_ENABLED: "true"
          CRAWL_IT68_SUPABASE_URL: ${{ vars.CRAWL_IT68_SUPABASE_URL }}
          CRAWL_IT68_SUPABASE_SECRET_KEY: ${{ secrets.CRAWL_IT68_SUPABASE_SECRET_KEY }}
          REQUESTED_BUDGET: ${{ github.event_name == 'workflow_dispatch' && inputs.source_budget || '1' }}
        run: |
          case "$REQUESTED_BUDGET" in 1|2|3) ;; *) exit 2;; esac
          python -m app.approved_source_batch --sources "$REQUESTED_BUDGET"
