name: TRUST-AUDIT1C2 — Employer Reference Audit
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/trust_audit1c2_employer_reference.py
      - .github/workflows/trust-audit1c2-reference.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Synthetic scanner test
        run: python3 scripts/trust_audit1c2_employer_reference.py --self-test
      - name: Tracked working-tree reference inventory
        run: python3 scripts/trust_audit1c2_employer_reference.py
