name: STAGING-READY1 Isolated Schema Acceptance

on:
  # Temporary, branch-scoped, read-only inspection after a trusted code push.
  # NEVER run an apply during this event; apply requires manual dispatch.
  push:
    branches:
      - feat/staging-ready1-isolated-schema-acceptance
    paths:
      - .github/workflows/staging-ready1-schema-acceptance.yml
      - scripts/staging-ready1-target-guard.py
      - supabase/tests/staging_ready1_isolation_preflight.sql
      - apps/web/tests/staging-ready1-schema-acceptance.test.mjs
  workflow_dispatch:
    inputs:
      project_ref:
        description: "Type the staging project ref (NEVER production)"
        type: string
        required: true
      run_mode:
        description: "Start with plan; apply changes only after inspecting the migration plan"
        type: choice
        required: true
        default: plan
        options:
          - plan
          - apply

permissions:
  contents: read

concurrency:
  group: staging-ready1-schema-acceptance
  cancel-in-progress: false

jobs:
  isolated-schema:
    name: staging schema plan and tenant acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      STAGING_READY1_DB_URL: ${{ secrets.STAGING_READY1_DB_URL }}
      STAGING_READY1_REF: lwrrrphakpbjhbzljqhn
      REQUESTED_PROJECT_REF: ${{ github.event_name == 'push' && 'lwrrrphakpbjhbzljqhn' || inputs.project_ref }}
      REQUESTED_RUN_MODE: ${{ github.event_name == 'push' && 'plan' || inputs.run_mode }}
    steps:
      - uses: actions/checkout@v4
      - name: Check target identity and secret without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/staging-ready1-target-guard.py
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Inject historical CI baselines for isolated staging only
        shell: bash
        run: |
          set -euo pipefail
          test -f supabase/ci/p0_pre_worker_baseline.sql
          test -f supabase/ci/p0_staging_baseline.sql
          test ! -e supabase/migrations/20260908000000_ci_pre_worker_baseline.sql
          test ! -e supabase/migrations/20260908000001_ci_staging_baseline.sql
          cp supabase/ci/p0_pre_worker_baseline.sql supabase/migrations/20260908000000_ci_pre_worker_baseline.sql
          cp supabase/ci/p0_staging_baseline.sql supabase/migrations/20260908000001_ci_staging_baseline.sql
          echo "Historical baselines injected into the ephemeral runner only."
      - name: Plan all remote staging migrations (read-only)
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "$STAGING_READY1_DB_URL" --dry-run
      - name: Reject nonempty staging before schema application
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          psql "$STAGING_READY1_DB_URL" --no-psqlrc -X -v ON_ERROR_STOP=1 \
            -f supabase/tests/staging_ready1_pristine_guard.sql
      - name: Apply schema to isolated staging (explicit approval only)
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          supabase db push --db-url "$STAGING_READY1_DB_URL" --yes
      - name: Confirm core tables and RLS; synthetic data is never persisted
        if: github.event_name == 'workflow_dispatch' && inputs.run_mode == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          command -v psql >/dev/null || { echo "::error::psql is required on this runner"; exit 1; }
          psql "$STAGING_READY1_DB_URL" --no-psqlrc -X -v ON_ERROR_STOP=1 -f supabase/tests/staging_ready1_isolation_preflight.sql
          psql "$STAGING_READY1_DB_URL" --no-psqlrc -X -v ON_ERROR_STOP=1 -f supabase/tests/p0_tenant_isolation.sql
          psql "$STAGING_READY1_DB_URL" --no-psqlrc -X -v ON_ERROR_STOP=1 -f supabase/tests/p1_tenant_onboarding.sql
      - name: Report
        shell: bash
        run: |
          echo "Staging-only ${REQUESTED_RUN_MODE} completed. Production was never targeted."
