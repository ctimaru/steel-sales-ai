name: "CRAWL-IT6.5 Wikidata Read-Only Pilot (manual)"

on:
  workflow_dispatch:
    inputs:
      max_domains:
        description: "Maximum preview domains (1-5; no DB writes)"
        required: true
        type: choice
        default: "5"
        options: ["1", "3", "5"]

permissions:
  contents: read

jobs:
  preview:
    name: "One Wikidata CC0 query, dry-run only"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Install worker's public dependencies (no Supabase or Railway credentials)"
        run: python -m pip install -e ./services/worker
      - name: "Single query; display max five candidate domains, no network actions"
        env:
          MAX_DOMAINS: ${{ inputs.max_domains }}
        run: |
          set -euo pipefail
          case "$MAX_DOMAINS" in 1|3|5) ;; *) echo "invalid budget"; exit 2 ;; esac
          python -m app.wikidata_source_discovery --limit "$MAX_DOMAINS"
        working-directory: services/worker
