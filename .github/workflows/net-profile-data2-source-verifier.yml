name: "NET-PROFILE-DATA2 — Source-grounded industrial review"

# Operates on already discovered PRIVATE candidate claims, not new company
# publication. Exactly-supported low-risk claims are accepted with a private
# per-version decision audit. Missing keys/LLM/robots/migration fail closed.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "First-party canonical evidence to review (max 50)"
        required: true
        default: "5"
        type: choice
        options: ["5", "25", "50"]
      persist:
        description: "Record bounded review decisions (unchecked = read-only preview)"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "43 17 * * *"

permissions:
  contents: read

concurrency:
  group: net-profile-data2-source-review
  cancel-in-progress: false

jobs:
  review:
    if: github.ref == 'refs/heads/main'
    name: "First-party AI source and quote corroboration"
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install worker (pinned model client)
        working-directory: services/worker
        run: python -m pip install -e .
      - name: Check backend-only secrets and AI availability
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_URL" ] || { [ -z "$SUPABASE_SECRET_KEY" ] && [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; } || [ -z "$HF_TOKEN" ]; then
            echo "::error::NET-PROFILE-DATA2 requires Worker Supabase private key and HF_TOKEN; no decisions recorded"
            exit 1
          fi
      - name: Review first-party evidence (no public profile publication)
        working-directory: services/worker
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          NET_PROFILE_DATA2_MODEL: Qwen/Qwen3-4B-Instruct-2507
          LIMIT: ${{ inputs.limit || '25' }}
          PERSIST: ${{ github.event_name == 'schedule' || inputs.persist }}
        run: |
          set -euo pipefail
          case "$LIMIT" in 5|25|50) ;; *) echo "::error::Invalid limit"; exit 1 ;; esac
          if [ "$PERSIST" = "true" ]; then
            python -m app.net_profile_data2_reviewer --limit "$LIMIT" --persist
          else
            python -m app.net_profile_data2_reviewer --limit "$LIMIT"
          fi
