name: PERF2.1 Saved PageSpeed Mobile Review

on:
  pull_request:
    paths:
      - ".github/workflows/perf2-1-pagespeed-review.yml"
      - "apps/web/tests/perf2-1-pagespeed-review.mjs"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  saved-pagespeed:
    name: Chrome / Three Saved Mobile Reports / Read-Only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Chrome
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chrome
      - name: Read saved PageSpeed reports
        run: node tests/perf2-1-pagespeed-review.mjs
