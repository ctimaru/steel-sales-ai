name: "SUPA-LEDGER3 — One-shot Official Linked CLI Read-only Audit"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/supa-ledger3-linked-cli-once.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supa-ledger3-official-linked-readonly
  cancel-in-progress: false

jobs:
  official-readonly-cli:
    if: github.repository == 'ctimaru/steel-sales-ai' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0
      - name: Ensure the protected official credentials are configured
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" ]]; then
            echo "::error::SUPABASE_ACCESS_TOKEN and/or SUPABASE_DB_PASSWORD are missing as protected GitHub Repository Secrets."
            echo "Configure these two secret NAMES in GitHub, never paste their VALUES in issues or chat."
            exit 1
          fi
          echo "::add-mask::$SUPABASE_ACCESS_TOKEN"
          echo "::add-mask::$SUPABASE_DB_PASSWORD"
          echo "Supabase official CLI credentials found; no SQL or history mutation will run."
      - name: Link to the exact production project (configuration only, no DDL)
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase link --project-ref ecrafjdummcdfycznitx
      - name: Capture official Supabase migration list — READ ONLY
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          set -euo pipefail
          supabase migration list --linked > official-linked-cli-migrations.txt
          test -s official-linked-cli-migrations.txt
          printf 'Captured %s lines from official linked migration list; no db push or repair performed.\n' "$(wc -l < official-linked-cli-migrations.txt)"
      - name: Archive official CLI evidence
        uses: actions/upload-artifact@v4
        with:
          name: supa-ledger3-official-linked-cli-${{ github.run_id }}
          path: official-linked-cli-migrations.txt
          if-no-files-found: error
          retention-days: 30
