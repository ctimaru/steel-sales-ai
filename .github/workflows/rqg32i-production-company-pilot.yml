name: RQG3.2i — Production Company Pilot Read-Only Acceptance

on:
  workflow_dispatch:
    inputs:
      approval:
        description: "Type RQG32I_APPROVE_CONSENTED_PILOT_READ_ONLY (document voluntary pilot approval first)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rqg32i-consented-production-company-pilot
  cancel-in-progress: false

jobs:
  company-pilot:
    name: Approved Company pilot / hosted read-only Chrome + JWT
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production-qa
    timeout-minutes: 25
    env:
      CI: "true"
      RQG32I_APPROVAL: $\{{ inputs.approval }}
      RQG32I_SUPABASE_URL: https://ecrafjdummcdfycznitx.supabase.co
    steps:
      - name: Require exact manual approval and guarded main
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RQG32I_APPROVAL" != "RQG32I_APPROVE_CONSENTED_PILOT_READ_ONLY" ]; then
            echo "RQG32I BLOCKED: approved and documented pilot required"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install pinned dependencies without production secrets
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Validate existing admin membership, current real legal consent, own Review and sole Owner
        working-directory: apps/web
        env:
          RQG32I_ADMIN_KEY: $\{{ secrets.RQG32A_AUTH_SECRET_KEY }}
          RQG32I_PILOT_SCOPE_JSON: $\{{ secrets.RQG32I_PILOT_SCOPE_JSON }}
        run: node tests/rqg32i-production-company-preflight.mjs
      - name: Install ephemeral Chrome without production secrets
        working-directory: apps/web
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chrome
      - name: Verify pilot JWT-scoped GET and real Company Chrome, deny Platform
        working-directory: apps/web
        timeout-minutes: 15
        env:
          RQG32I_PILOT_SCOPE_JSON: $\{{ secrets.RQG32I_PILOT_SCOPE_JSON }}
          RQG32I_PILOT_PASSWORD: $\{{ secrets.RQG32I_PILOT_PASSWORD }}
          RQG32I_PUBLISHABLE_KEY: $\{{ secrets.RQG32I_PUBLISHABLE_KEY }}
        run: node tests/rqg32i-production-company-chrome.mjs
      # NO Review Confirm/Correct, Terms acceptance, Platform grant, preview,
      # customer-data artifacts, cookies, screenshots, traces or Vercel cron.
