name: "SUPA-LEDGER2 — Stored SQL Fingerprint Equivalence Audit"

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/tools/migration_sql_fingerprint_audit.py"
      - "supabase/tools/test_migration_sql_fingerprint_audit.py"
      - "supabase/tools/migration_reconciliation_plan.py"
      - "supabase/tools/test_migration_reconciliation_plan.py"
      - "supabase/tools/migration_orphan_duplicate_provenance.py"
      - "supabase/tools/test_migration_orphan_duplicate_provenance.py"
      - "supabase/audits/20261021_migration_content_fingerprints.json"
      - ".github/workflows/supa-ledger2-sql-audit.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/supa-ledger2-sql-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supa-ledger2-sql-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-content-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests — no DB credentials or SQL execution
        run: python -m unittest discover -s supabase/tools -p 'test_migration_sql_fingerprint_audit.py' -v
      - name: Test fail-closed version, ordering and collision guards
        run: python -m unittest discover -s supabase/tools -p 'test_migration_reconciliation_plan.py' -v
      - name: Unit tests — orphan and duplicate evidence, no repair
        run: python -m unittest discover -s supabase/tools -p 'test_migration_orphan_duplicate_provenance.py' -v
      - name: Compare repo SQL bytes to production ledger original SHA256 snapshot
        run: |
          python supabase/tools/migration_sql_fingerprint_audit.py \
            --local supabase/migrations \
            --remote-hashes supabase/audits/20261021_migration_content_fingerprints.json \
            --report migration-sql-equivalence-report.json \
            --require-seven-trader-matches
          python - <<'PY'
          import json
          report=json.load(open("migration-sql-equivalence-report.json"))
          assert report["safe_for_automatic_repair"] is False
          assert report["summary"]["local_total"] >= 436
          assert report["summary"]["remote_total"] >= 465
          print("SQL fingerprint audit completed without database access or side effects")
          PY
      - name: Produce conservative NO-REPAIR decision ledger
        run: |
          python supabase/tools/migration_reconciliation_plan.py \
            --local supabase/migrations \
            --remote-hashes supabase/audits/20261021_migration_content_fingerprints.json \
            --output migration-conservative-history-plan.json
          python - <<'PY'
          import json
          plan=json.load(open("migration-conservative-history-plan.json"))
          assert plan["safe_for_automatic_repair"] is False
          assert plan["history_mutations_allowed"] is False
          assert plan["repair_commands"] == []
          assert plan["summary"]["local_total"] >= 437
          assert plan["summary"]["remote_total"] == 466
          print("Fail-closed historical plan generated; no repair authorized.")
          PY
      - name: Generate all orphan/duplicate provenance holdings — NO REPAIR
        run: |
          python supabase/tools/migration_orphan_duplicate_provenance.py \
            --local supabase/migrations \
            --remote-hashes supabase/audits/20261021_migration_content_fingerprints.json \
            --output migration-orphan-duplicate-provenance.json
          python - <<'PY'
          import json
          doc=json.load(open("migration-orphan-duplicate-provenance.json"))
          assert doc["safe_for_automatic_repair"] is False
          assert doc["history_mutations_allowed"] is False
          assert doc["repair_commands"] == []
          counts=doc["counts"]
          assert counts["local_only_entries"] == 12
          assert counts["remote_only_entries"] == 36
          assert counts["remote_duplicate_name_groups"] == 6
          assert counts["local_duplicate_name_groups"] == 1
          assert counts["identical_sql_remote_duplicate_groups"] == 5
          assert counts["divergent_sql_remote_duplicate_groups"] == 1
          print("Historical provenance holds confirmed; NO REPAIR.")
          PY
      - name: Archive full SQL equality / divergence classification
        uses: actions/upload-artifact@v4
        with:
          name: supa-ledger2-sql-equivalence-${{ github.run_id }}
          path: |
            migration-sql-equivalence-report.json
            migration-conservative-history-plan.json
            migration-orphan-duplicate-provenance.json
          retention-days: 30
          if-no-files-found: error
