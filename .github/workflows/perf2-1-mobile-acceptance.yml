name: PERF2.1 Mobile UX & Payload Acceptance

on:
  pull_request:
    paths:
      - "apps/web/app/page.tsx"
      - "apps/web/app/site-document.tsx"
      - "apps/web/app/(italian)/**"
      - "apps/web/app/(english)/**"
      - "apps/web/app/globals.css"
      - "apps/web/components/public-network-role-explorer.tsx"
      - "apps/web/components/public-registration-trust.tsx"
      - "apps/web/components/google-analytics-consent.tsx"
      - "apps/web/tests/home-si5-*"
      - "apps/web/components/deferred-public-company-lookup.tsx"
      - "apps/web/tests/perf2-1-*"
      - "apps/web/components/public-tube-weight-calculator.tsx"
      - "apps/web/components/calculator-region-switch.tsx"
      - "apps/web/components/calculator-region-switch.module.css"
      - "apps/web/tests/calc-int4-*"
      - "apps/web/components/us-hss-calculator.tsx"
      - "apps/web/tests/calc-int3d-*"
      - "apps/web/lib/us-hss-reference-samples.ts"
      - "apps/web/tests/calc-int3d2-*"
      - "apps/web/tests/calc-int3d3-*"
      - "apps/web/app/(international-calculator)/**"
      - "apps/web/components/international-steel-calculator.tsx"
      - "apps/web/components/calculator-flag-languages.tsx"
      - "apps/web/tests/calc-int3e1-*"
      - "apps/web/lib/us-calculator-i18n.ts"
      - "apps/web/lib/us-calculator-route-seed.ts"
      - "apps/web/tests/calc-int3e2-*"
      - "apps/web/tests/calc-int3e5-*"
      - "apps/web/lib/us-pipe-rfq-handoff.ts"
      - "apps/web/components/calculator-install-guide.tsx"
      - "apps/web/tests/calc-ux3-*"
      - "apps/web/tests/i18n8-*"
      - "apps/web/tests/bd11-*"
      - "apps/web/components/us-pipe-sample-calculator.tsx"
      - "apps/web/components/english-rfq-bill-builder.tsx"
      - "apps/web/components/buyer-distinta-builder.tsx"
      - "apps/web/tests/calc-int3c-*"
      - "apps/web/tests/bd12-*"
      - "apps/web/tests/bd17-*"
      - "apps/web/tests/bd18-*"
      - "apps/web/lib/platform-product-analytics.ts"
      - "apps/web/components/product-analytics-dashboard.tsx"
      - ".github/workflows/perf2-1-mobile-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobile-acceptance:
    name: Chrome mobile / keyboard / consent / 3 Lighthouse samples
    runs-on: ubuntu-latest
    timeout-minutes: 22
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install frontend & browser-only QA dependencies
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-package-lock playwright@1.56.1 lighthouse@12.6.0 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chrome
      - name: Compile production Next.js with no external data
        run: npm run build
      - name: Start disposable local production server
        run: |
          set -euo pipefail
          nohup npm run start -- --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/perf21-next.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/perf21-next.pid"
          for attempt in $(seq 1 50); do
            if curl --fail --silent http://127.0.0.1:3000/ > /dev/null; then
              echo "PERF2.1 LOCAL READY"
              exit 0
            fi
            sleep 2
          done
          tail -n 70 "$RUNNER_TEMP/perf21-next.log"
          exit 1
      - name: Chrome keyboard / no-JS / lazy lookup / consent acceptance
        run: node tests/perf2-1-chrome-mobile.mjs
      - name: CALC-UX3 Chrome IT/EN 320–1440px contrast / focus / touch QA
        run: node tests/calc-ux3-chrome-mobile.mjs
      - name: BD11 Chrome calculator-first, one-click visible mixed-norm RFQ bill
        run: node tests/bd11-chrome-quick-add.mjs
      - name: CALC-INT3C Chrome US NPS Schedule to IT/EN RFQ bills
        run: node tests/calc-int3c-chrome-us-rfq.mjs
      - name: CALC-INT4 Chrome cinematic EU/US switch and reduced-motion acceptance
        run: node tests/calc-int4-chrome-cinematic-switch.mjs
      - name: CALC-INT3D Chrome AISC A500 HSS to IT/EN RFQ
        run: node tests/calc-int3d-chrome-astm-hss.mjs
      - name: CALC-INT3D.2 Chrome Atlas HSS reference selection and RFQ provenance
        run: node tests/calc-int3d2-chrome-hss-library.mjs
      - name: CALC-INT3D.3 Chrome mobile HSS search/filter and RFQ
        run: node tests/calc-int3d3-chrome-hss-search.mjs
      - name: CALC-INT3E.1 Chrome DE FR ES multilingual calculator and SEO RFQ
        run: node tests/calc-int3e1-chrome-localized-calculator.mjs
      - name: CALC-INT3E.2 Chrome DE FR ES USA localization and RFQ
        run: node tests/calc-int3e2-chrome-usa-five-language.mjs
      - name: CALC-INT3E.5 Chrome DE/FR/ES + EN US mobile RFQ conversion acceptance
        run: node tests/calc-int3e5-chrome-rfq-funnel.mjs
      - name: BD17 Chrome A/B CTA variants, consent gating and login handoff
        run: node tests/bd17-chrome-cta-variants.mjs
      - name: HOME-SI5 Chrome visual / WCAG / SEO acceptance
        run: node tests/home-si5-chrome-visual-qa.mjs
      - name: Upload CALC-UX3 calculator Chrome screenshots (public / no credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calc-ux3-chrome-qa
          path: /tmp/calc-ux3
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload public visual QA screenshots (no accounts or credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: home-si5-public-visual-qa
          path: /tmp/home-si5
          if-no-files-found: ignore
          retention-days: 7
      - name: Repeated mobile Lighthouse benchmark (diagnostic; not a score gate)
        timeout-minutes: 8
        shell: bash
        run: |
          for i in 1 2 3; do
            node node_modules/lighthouse/cli/index.js http://127.0.0.1:3000/ \
              --only-categories=performance --form-factor=mobile \
              --throttling-method=simulate \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --quiet --output=json --output-path="$RUNNER_TEMP/perf21-$i.json"
          done
          node --input-type=module -e '
            import fs from "node:fs";
            const reports=[1,2,3].map(i=>JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+"/perf21-"+i+".json","utf8")));
            for(let i=0;i<reports.length;i++){
              const r=reports[i];const a=r.audits;
              console.log("PERF2.1 LIGHTHOUSE", JSON.stringify({run:i+1,score:Math.round(r.categories.performance.score*100),fcpMs:Math.round(a["first-contentful-paint"].numericValue),lcpMs:Math.round(a["largest-contentful-paint"].numericValue),tbtMs:Math.round(a["total-blocking-time"].numericValue),cls:a["cumulative-layout-shift"].numericValue,bytes:a["total-byte-weight"]?.numericValue}));
            }
            console.log("PERF2.1 LIGHTHOUSE NOTE: localhost CI and PSI production are not directly comparable");
          '
      - name: Local Next diagnostics
        if: failure()
        run: tail -n 100 "$RUNNER_TEMP/perf21-next.log" || true
      - name: Stop local Next
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/perf21-next.pid" ]; then kill "$(cat "$RUNNER_TEMP/perf21-next.pid")" || true; fi
