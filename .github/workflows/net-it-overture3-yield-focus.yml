name: "NET-IT-OVERTURE3 — yield-focused free multi-area pilot"
on:
  push:
    branches: ["net-it-overture3-yield-focus-20261118"]
    paths:
      - ".github/workflows/net-it-overture3-yield-focus.yml"
      - "services/worker/scripts/overture3_yield_focus.py"
permissions:
  contents: read
concurrency:
  group: net-it-overture3-yield-focus-readonly
  cancel-in-progress: false
jobs:
  yield-focus-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install open-source Overture query engine
        run: python -m pip install "duckdb>=1.4,<2"
      - name: Discover licensed Overture website pointers, no writes
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: python services/worker/scripts/overture3_yield_focus.py
