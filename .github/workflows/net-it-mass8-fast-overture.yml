name: "NET-IT-MASS8-FAST — supplier/manufacturer discovery"
on:
  push:
    branches: ["net-it-mass8-fast-20261120"]
    paths:
      - ".github/workflows/net-it-mass8-fast-overture.yml"
      - "services/worker/scripts/overture15b_mass8_fast.py"
permissions:
  contents: write
concurrency:
  group: net-it-mass8-fast-20261120-readonly
  cancel-in-progress: false
jobs:
  read-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "duckdb>=1.4,<2"
      - name: Read licensed supplier/manufacturer website pointers
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: python services/worker/scripts/overture15b_mass8_fast.py
      - name: Store provenance CSV
        run: |
          set -euo pipefail
          audit="services/worker/audits/net_it_mass8_fast_20261120_gers.csv"
          test -s "$audit"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$audit"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit(network): MASS8-fast Overture supplier pointers"
          git push origin HEAD:refs/heads/net-it-mass8-fast-20261120
