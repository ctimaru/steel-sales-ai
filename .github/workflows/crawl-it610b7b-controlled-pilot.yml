name: "CRAWL-IT6.10b.7b — Controlled Candidate Gate Pilot"
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Approved operator-owned run UUID (four prelinked leads)"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: crawl-it610b7b-controlled-pilot
  cancel-in-progress: false
jobs:
  pilot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - working-directory: services/worker
        run: python -m pip install -e .
      - name: Four-domain controlled staging — no publication
        working-directory: services/worker
        env:
          CRAWL_IT68_SUPABASE_URL: ${{ vars.CRAWL_IT68_SUPABASE_URL }}
          CRAWL_IT68_SUPABASE_SECRET_KEY: ${{ secrets.CRAWL_IT68_SUPABASE_SECRET_KEY }}
          CRAWL_PILOT_RUN_ID: ${{ inputs.run_id }}
        run: python -m app.crawl_it610b7b_pilot
