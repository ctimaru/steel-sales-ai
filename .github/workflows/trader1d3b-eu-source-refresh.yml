name: "TRADER1D.3B — EU Source Trust Refresh (HEAD metadata only)"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/trader1d3b-eu-source-refresh.yml"
  schedule:
    # Five official-company source URLs/day; full 60-site rotation in 12 days.
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trader-eu-source-refresh
  cancel-in-progress: false

jobs:
  inspect:
    # Legacy manifest rotation stops once live Supabase refresh is enabled.
    if: github.ref == 'refs/heads/main' && vars.TRADER1D3B2_ENABLED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install existing worker
        working-directory: services/worker
        run: python -m pip install -e '.[test]'
      - name: Validate source manifest and safe runner
        working-directory: services/worker
        run: |
          python -m app.trader1d3b_source_refresh --validate-only
          python -m pytest -q tests/test_trader1d3b_source_refresh.py
      - name: Restore best-effort previous observations (NO secrets)
        uses: actions/cache/restore@v4
        with:
          path: services/worker/data/trader1d3b_state.json
          key: trader1d3b-cache-${{ github.run_id }}
          restore-keys: |
            trader1d3b-cache-
      - name: Inspect five sites (one HEAD each; robots-aware; no DB writes)
        working-directory: services/worker
        run: |
          python -m app.trader1d3b_source_refresh \
            --manifest data/trader1d3b_sources.json \
            --state data/trader1d3b_state.json \
            --report trader1d3b_report.json
      - name: Save best-effort state for next rotation
        if: success()
        uses: actions/cache/save@v4
        with:
          path: services/worker/data/trader1d3b_state.json
          key: trader1d3b-cache-${{ github.run_id }}
      - name: Archive immutable per-run source metadata report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trader1d3b-source-refresh-${{ github.run_id }}
          path: services/worker/trader1d3b_report.json
          retention-days: 30
          if-no-files-found: warn
