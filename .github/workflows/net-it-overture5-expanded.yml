name: "NET-IT-OVERTURE5 — licensed industrial lead scan (read-only)"
on:
  push:
    branches: ["net-it-overture5-expanded-20261118"]
    paths:
      - ".github/workflows/net-it-overture5-expanded.yml"
      - "services/worker/scripts/overture5_expanded.py"
  pull_request:
    paths:
      - ".github/workflows/net-it-overture5-expanded.yml"
      - "services/worker/scripts/overture5_expanded.py"
permissions:
  contents: read
concurrency:
  group: net-it-overture5-readonly
  cancel-in-progress: false
jobs:
  overture5-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free Overture query engine
        run: python -m pip install "duckdb>=1.4,<2"
      - name: Sample only public Overture industrial website pointers and source licenses
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: python services/worker/scripts/overture5_expanded.py
