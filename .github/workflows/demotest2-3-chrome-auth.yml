name: DEMOTEST2.3 Chrome Real Multi-Account Acceptance

on:
  pull_request:
    paths:
      - "apps/web/tests/demotest23-*.mjs"
      - "apps/web/tests/comm-ux1c-chrome-search.mjs"
      - "apps/web/tests/comm-ux1-chrome-auth.mjs"
      - "apps/web/tests/rfqh14-2-*.mjs"
      - "apps/web/tests/prod-next1c-*.mjs"
      - "apps/web/tests/prod-next1d-*.mjs"
      - "supabase/tests/prod_next1d_*.sql"
      - "apps/web/tests/bd15-*.mjs"
      - "apps/web/tests/bd18-*.mjs"
      - "supabase/tests/bd15_*.sql"
      - "apps/web/tests/rfqh14-2b-*.mjs"
      - "supabase/tests/rfqh14_2b_*.sql"
      - "supabase/tests/rfqh14_2_chrome_procurement_seed.sql"
      - "supabase/tests/demotest2_3_chrome_seed.sql"
      - ".github/workflows/demotest2-3-chrome-auth.yml"
      - "apps/web/app/login/**"
      - "apps/web/lib/workspace-context.ts"
      - "apps/web/app/**/dashboard/page.tsx"
      - "apps/web/app/**/rfq-hub/**"
      - "apps/web/app/**/marketplace/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome-multi-tenant:
    name: Chrome / 5 real GoTrue sessions / 4 isolated tenants
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DEMOTEST23_WEB_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      CI: "true"
      RESEND_API_KEY: ""  # No provider calls. PO browser test is local-only.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: CI-only historical baselines (no production access)
        run: |
          cp supabase/ci/p0_pre_worker_baseline.sql supabase/migrations/20260908000000_ci_pre_worker_baseline.sql
          cp supabase/ci/p0_staging_baseline.sql supabase/migrations/20260908000001_ci_staging_baseline.sql
      - name: Start throwaway Supabase Auth + PostgreSQL
        run: |
          supabase start
          supabase db reset --local
      - name: Capture LOCAL Supabase keys without logging them
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          supabase status -o env > "$RUNNER_TEMP/demotest23-local.env"
          source "$RUNNER_TEMP/demotest23-local.env"
          test -n "$ANON_KEY"
          test -n "$SERVICE_ROLE_KEY"
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
      - name: Install Next.js + Playwright Google Chrome stable
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chrome
      - name: Create five REAL GoTrue users (local only)
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/demotest23-local.env"
          DEMOTEST23_LOCAL_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            SUPABASE_URL=http://127.0.0.1:54321 \
            node tests/demotest23-seed-auth.mjs
      - name: Seed private four-tenant RFQs (local DB only)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 \
            -f "$RUNNER_TEMP/demotest23-psql-vars.sql" \
            -f supabase/tests/demotest2_3_chrome_seed.sql
      - name: RFQH14.2 — Generate ephemeral guest tokens (LOCAL only)
        working-directory: apps/web
        run: node tests/rfqh14-2-prepare-portal.mjs
      - name: RFQH14.2 — Seed unsent buyer RFQ and two isolated supplier portals (LOCAL only)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 \
            -f "$RUNNER_TEMP/demotest23-psql-vars.sql" \
            -f "$RUNNER_TEMP/rfqh14-2-psql-vars.sql" \
            -f supabase/tests/rfqh14_2_chrome_procurement_seed.sql
      - name: "RFQH14.2b — Enable ephemeral PO HMAC secret, local Next only"
        shell: bash
        run: |
          set -euo pipefail
          test_secret="$(openssl rand -hex 32)"
          echo "::add-mask::$test_secret"
          echo "PO_CONFIRMATION_SECRET=$test_secret" >> "$GITHUB_ENV"
      - name: Start REAL Next.js against local Supabase (never Vercel)
        shell: bash
        working-directory: apps/web
        run: |
          set -euo pipefail
          nohup npm run dev -- --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/demotest23-next.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/demotest23-next.pid"
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail --location --max-time 8 \
                http://127.0.0.1:3000/login > /dev/null 2>&1; then
              echo "LOCAL NEXT READY"
              exit 0
            fi
            sleep 3
          done
          echo "LOCAL NEXT FAILED to start"
          tail -n 70 "$RUNNER_TEMP/demotest23-next.log"
          exit 1
      - name: "COMM-UX1 authenticated navigation: 5 real accounts, 4 isolated tenants, desktop and 390px"
        working-directory: apps/web
        timeout-minutes: 12
        run: node tests/comm-ux1-chrome-auth.mjs
      - name: "Save visual QA evidence from synthetic identities only"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comm-ux1-synthetic-visual-qa
          path: ${{ runner.temp }}/comm-ux1-safe-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: "COMM-UX1C Chrome authenticated search, roles, categories and 390px"
        working-directory: apps/web
        timeout-minutes: 12
        run: node tests/comm-ux1c-chrome-search.mjs
      - name: "COMM-UX1C synthetic search visual evidence"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comm-ux1c-synthetic-search
          path: ${{ runner.temp }}/comm-ux1c-search-screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
      - name: "Google Chrome browser: login, tenant isolation, RFQ Hub, Marketplace, mobile"
        working-directory: apps/web
        timeout-minutes: 20
        run: node tests/demotest23-chrome-auth.mjs
      - name: "RFQH14.2 Chrome: buyer, isolated supplier portals, quote, mobile 390 + 430"
        working-directory: apps/web
        timeout-minutes: 20
        run: node tests/rfqh14-2-chrome-procurement.mjs
      - name: "BD15 — Chrome E2E calculator → RFQ → bulk suppliers → reviewed confirmation"
        working-directory: apps/web
        timeout-minutes: 15
        run: node tests/bd15-chrome-rfq-funnel.mjs
      - name: "BD15 — Assert LOCAL-only two private RFQs, mixed EN and zero dispatch"
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/bd15_acceptance_no_send.sql
      - name: "BD15 — Reset only the two verified local browser fixtures"
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/bd15_reset_local_browser_fixture.sql
      - name: "BD15 — Consecutive second Chrome run on the same commit"
        working-directory: apps/web
        timeout-minutes: 15
        run: node tests/bd15-chrome-rfq-funnel.mjs
      - name: "BD15 — Assert second run preserved private RFQs, mixed EN and zero dispatch"
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -f supabase/tests/bd15_acceptance_no_send.sql
      - name: "RFQH14.2b — Seed pending second-user PO approval (LOCAL DB)"
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 \
            -f "$RUNNER_TEMP/demotest23-psql-vars.sql" \
            -f supabase/tests/rfqh14_2b_chrome_po_approval_seed.sql
      - name: "RFQH14.2b Chrome — independent approver, PO issue, supplier confirmation"
        working-directory: apps/web
        timeout-minutes: 20
        run: node tests/rfqh14-2b-chrome-po-approver.mjs
      - name: "RFQH14.2b — Assert immutable PO and no provider sends (LOCAL DB)"
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 \
            -f "$RUNNER_TEMP/demotest23-psql-vars.sql" \
            -f supabase/tests/rfqh14_2b_assert_po_browser.sql
      - name: "PROD-NEXT1.D — Generate fresh local-only supplier tokens for BD15 RFQ"
        working-directory: apps/web
        run: node tests/prod-next1d-prepare-portal.mjs
      - name: "PROD-NEXT1.D — Launch the exact Chrome-created private RFQ using business RPC"
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 \
            -f "$RUNNER_TEMP/demotest23-psql-vars.sql" \
            -f "$RUNNER_TEMP/prod-next1d-psql-vars.sql" \
            -f supabase/tests/prod_next1d_launch_saved_rfq.sql
          umask 077
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -At -c \
            "select id from public.buyer_rfq_campaigns where title='BD15 E2E LOCAL 1440'" \
            > "$RUNNER_TEMP/prod-next1d-rfq-id.txt"
          test "$(wc -l < "$RUNNER_TEMP/prod-next1d-rfq-id.txt")" -eq 1
      - name: "PROD-NEXT1.D — Real Chrome supplier quotation on the SAME RFQ"
        working-directory: apps/web
        timeout-minutes: 12
        run: node tests/prod-next1d-chrome-single-rfq.mjs quote
      - name: "PROD-NEXT1.D — Prepare award and independent approval on SAME RFQ"
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 \
            -f "$RUNNER_TEMP/demotest23-psql-vars.sql" \
            -f supabase/tests/prod_next1d_prepare_po_approval.sql
      - name: "PROD-NEXT1.D — Real Chrome 2nd-person approval, PO issue and supplier confirmation"
        working-directory: apps/web
        timeout-minutes: 15
        run: node tests/prod-next1d-chrome-single-rfq.mjs po
      - name: "PROD-NEXT1.D — SQL identity/price/authorization/provenance proof on SAME RFQ"
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 \
            -f "$RUNNER_TEMP/demotest23-psql-vars.sql" \
            -f supabase/tests/prod_next1d_assert_single_rfq.sql
      - name: "PROD-NEXT1.D — Upload safe same-RFQ synthetic milestone receipt"
        uses: actions/upload-artifact@v4
        with:
          name: prod-next1d-single-rfq-qa
          path: ${{ runner.temp }}/prod-next1d-single-rfq-proof.json
          if-no-files-found: error
          retention-days: 7
      - name: "PROD-NEXT1.C — Strict buyer/supplier/viewer activation evidence (LOCAL only)"
        working-directory: apps/web
        run: node tests/prod-next1c-summarize-journey.mjs
      - name: "PROD-NEXT1.C — Upload scrubbed synthetic timings (never live customer metrics)"
        uses: actions/upload-artifact@v4
        with:
          name: prod-next1c-synthetic-journey
          path: ${{ runner.temp }}/prod-next1c-evidence/*.json
          if-no-files-found: error
          retention-days: 7
      - name: Local Next.js render diagnostics after Chrome failure
        if: failure()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/demotest23-next.log" ]; then
            grep -E 'Error|error|Failed|failed|/dashboard|Exception|permission' \
              "$RUNNER_TEMP/demotest23-next.log" | tail -n 70 || true
          fi
      - name: Stop local Next.js and DESTROY temporary Supabase
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/demotest23-next.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/demotest23-next.pid")" || true
          fi
          supabase stop --no-backup || true
          rm -f "$RUNNER_TEMP/demotest23-personas.json" "$RUNNER_TEMP/demotest23-psql-vars.sql" \
            "$RUNNER_TEMP/demotest23-local.env" "$RUNNER_TEMP/rfqh14-2-tokens.json" \
            "$RUNNER_TEMP/rfqh14-2-psql-vars.sql"
