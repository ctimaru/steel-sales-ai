name: DEMOTEST2.3 Chrome Real Multi-Account Acceptance

on:
  pull_request:
    paths:
      - "apps/web/tests/demotest23-*.mjs"
      - "apps/web/tests/rfqh14-2-*.mjs"
      - "supabase/tests/rfqh14_2_chrome_procurement_seed.sql"
      - "supabase/tests/demotest2_3_chrome_seed.sql"
      - ".github/workflows/demotest2-3-chrome-auth.yml"
      - "apps/web/app/login/**"
      - "apps/web/lib/workspace-context.ts"
      - "apps/web/app/**/dashboard/page.tsx"
      - "apps/web/app/**/rfq-hub/**"
      - "apps/web/app/**/marketplace/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chrome-multi-tenant:
    name: Chrome / 5 real GoTrue sessions / 4 isolated tenants
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DEMOTEST23_WEB_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: CI-only historical baselines (no production access)
        run: |
          cp supabase/ci/p0_pre_worker_baseline.sql supabase/migrations/20260908000000_ci_pre_worker_baseline.sql
          cp supabase/ci/p0_staging_baseline.sql supabase/migrations/20260908000001_ci_staging_baseline.sql
      - name: Start throwaway Supabase Auth + PostgreSQL
        run: |
          supabase start
          supabase db reset --local
      - name: Capture LOCAL Supabase keys without logging them
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          supabase status -o env > "$RUNNER_TEMP/demotest23-local.env"
          source "$RUNNER_TEMP/demotest23-local.env"
          test -n "$ANON_KEY"
          test -n "$SERVICE_ROLE_KEY"
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
      - name: Install Next.js + Playwright Google Chrome stable
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chrome
      - name: Create five REAL GoTrue users (local only)
        working-directory: apps/web
        shell: bash
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/demotest23-local.env"
          DEMOTEST23_LOCAL_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
            SUPABASE_URL=http://127.0.0.1:54321 \
            node tests/demotest23-seed-auth.mjs
      - name: Seed private four-tenant RFQs (local DB only)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 \
            -f "$RUNNER_TEMP/demotest23-psql-vars.sql" \
            -f supabase/tests/demotest2_3_chrome_seed.sql
      - name: RFQH14.2 — Generate ephemeral guest tokens (LOCAL only)
        working-directory: apps/web
        run: node tests/rfqh14-2-prepare-portal.mjs
      - name: RFQH14.2 — Seed unsent buyer RFQ and two isolated supplier portals (LOCAL only)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 54322 -U postgres -d postgres \
            -v ON_ERROR_STOP=1 \
            -f "$RUNNER_TEMP/demotest23-psql-vars.sql" \
            -f "$RUNNER_TEMP/rfqh14-2-psql-vars.sql" \
            -f supabase/tests/rfqh14_2_chrome_procurement_seed.sql
      - name: Start REAL Next.js against local Supabase (never Vercel)
        shell: bash
        working-directory: apps/web
        run: |
          set -euo pipefail
          nohup npm run dev -- --hostname 127.0.0.1 --port 3000 > "$RUNNER_TEMP/demotest23-next.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/demotest23-next.pid"
          for attempt in $(seq 1 60); do
            if curl --silent --show-error --fail --location --max-time 8 \
                http://127.0.0.1:3000/login > /dev/null 2>&1; then
              echo "LOCAL NEXT READY"
              exit 0
            fi
            sleep 3
          done
          echo "LOCAL NEXT FAILED to start"
          tail -n 70 "$RUNNER_TEMP/demotest23-next.log"
          exit 1
      - name: "Google Chrome browser: login, tenant isolation, RFQ Hub, Marketplace, mobile"
        working-directory: apps/web
        timeout-minutes: 20
        run: node tests/demotest23-chrome-auth.mjs
      - name: "RFQH14.2 Chrome: buyer, isolated supplier portals, quote, mobile 390 + 430"
        working-directory: apps/web
        timeout-minutes: 20
        run: node tests/rfqh14-2-chrome-procurement.mjs
      - name: Local Next.js render diagnostics after Chrome failure
        if: failure()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/demotest23-next.log" ]; then
            grep -E 'Error|error|Failed|failed|/dashboard|Exception|permission' \
              "$RUNNER_TEMP/demotest23-next.log" | tail -n 70 || true
          fi
      - name: Stop local Next.js and DESTROY temporary Supabase
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/demotest23-next.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/demotest23-next.pid")" || true
          fi
          supabase stop --no-backup || true
          rm -f "$RUNNER_TEMP/demotest23-personas.json" "$RUNNER_TEMP/demotest23-psql-vars.sql" \
            "$RUNNER_TEMP/demotest23-local.env" "$RUNNER_TEMP/rfqh14-2-tokens.json" \
            "$RUNNER_TEMP/rfqh14-2-psql-vars.sql"
