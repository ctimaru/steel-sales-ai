name: "NET-IT-CARP-MASS11B — welding and sheet-metal discovery"
on:
  push:
    branches: ["net-it-carp-mass11-national-20261123"]
    paths:
      - ".github/workflows/net-it-carp-mass11b-national.yml"
      - "services/worker/scripts/overture_carp_mass11b_national.py"
permissions:
  contents: write
concurrency:
  group: net-it-carp-mass11b-audit
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: net-it-carp-mass11-national-20261123
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install public dataset query engine
        run: python -m pip install "duckdb>=1.4,<2"
      - name: Read source-licensed industrial website pointers
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: python services/worker/scripts/overture_carp_mass11b_national.py
      - name: Preserve independently versioned GERS audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/worker/audits/net_it_carp_mass11b_20261123_gers.csv
          if ! git diff --cached --quiet; then
            git commit -m "audit(MASS11B): retain licensed GERS pointer evidence [skip ci]"
            git pull --rebase origin net-it-carp-mass11-national-20261123
            git push origin HEAD:refs/heads/net-it-carp-mass11-national-20261123
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: net-it-carp-mass11b-20261123-gers
          path: services/worker/audits/net_it_carp_mass11b_20261123_gers.csv
          if-no-files-found: error
