name: "NET-IT-OVERTURE7 — licensed industrial lead scan (read-only)"
on:
  push:
    branches: ["net-it-overture6-increment-20261119"]
    paths:
      - ".github/workflows/net-it-overture7-expanded.yml"
      - "services/worker/scripts/overture7_expanded.py"
permissions:
  contents: write
concurrency:
  group: net-it-overture7-readonly
  cancel-in-progress: false
jobs:
  overture7-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install free Overture query engine
        run: python -m pip install "duckdb>=1.4,<2"
      - name: Sample only public Overture industrial website pointers and source licenses
        env:
          AWS_EC2_METADATA_DISABLED: "true"
        run: python services/worker/scripts/overture7_expanded.py
      - name: Commit ONLY the bounded GERS/license audit to the isolated branch
        if: github.ref == 'refs/heads/net-it-overture6-increment-20261119'
        run: |
          set -euo pipefail
          audit="services/worker/audits/net_it_overture7_20261119_gers.csv"
          test -s "$audit"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$audit"
          if git diff --cached --quiet; then
            echo "Identical source audit already committed"
            exit 0
          fi
          test "$(git diff --cached --name-only)" = "$audit"
          git commit -m "audit(NET-IT): Overture7 licensed GERS website pointers"
          git push origin HEAD:refs/heads/net-it-overture6-increment-20261119
