name: "TRADER1D.3B.2 — Live EU Source Intelligence"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/trader1d3b2-live-source-intelligence.yml"
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trader-eu-source-refresh
  cancel-in-progress: false

jobs:
  contract:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test live source worker contract without production credentials
        working-directory: services/worker
        run: |
          python -m pip install -e '.[test]'
          python -m pytest -q tests/test_trader1d3b2_live_refresh.py

  live:
    # OFF until #780 migration ledger reconciliation, new migration deployed
    # and service-only backend RPCs are read back and accepted.
    if: >-
      github.ref == 'refs/heads/main' &&
      vars.TRADER1D3B2_ENABLED == 'true' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded worker
        working-directory: services/worker
        run: python -m pip install -e '.[test]'
      - name: Validate scoped Supabase connection (no secrets in logs)
        env:
          CRAWL_IT65B_SUPABASE_URL: ${{ vars.CRAWL_IT65B_SUPABASE_URL }}
          CRAWL_IT65B_SUPABASE_SECRET_KEY: ${{ secrets.CRAWL_IT65B_SUPABASE_SECRET_KEY }}
        run: |
          test "$CRAWL_IT65B_SUPABASE_URL" = "https://ecrafjdummcdfycznitx.supabase.co" || exit 1
          case "$CRAWL_IT65B_SUPABASE_SECRET_KEY" in sb_secret_*) ;; *) exit 1;; esac
          echo "::add-mask::$CRAWL_IT65B_SUPABASE_SECRET_KEY"
      - name: Live source RPC batch and atomic metadata append
        working-directory: services/worker
        env:
          CRAWL_IT65B_SUPABASE_URL: ${{ vars.CRAWL_IT65B_SUPABASE_URL }}
          CRAWL_IT65B_SUPABASE_SECRET_KEY: ${{ secrets.CRAWL_IT65B_SUPABASE_SECRET_KEY }}
        run: python -m app.trader1d3b2_live_refresh
