name: "NET-FAST2 — Daily CC0 Industrial Discovery"

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/netfast2-wikidata-feed.yml"
  # Legacy NET-FAST2 is manual-only; NET-LAUNCH2 owns the daily CC0 budget.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: netfast2-cc0-daily-source
  cancel-in-progress: false

jobs:
  discover:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install existing worker package
        working-directory: services/worker
        run: python -m pip install -e .
      - name: Validate dedicated connection
        env:
          CRAWL_IT65B_SUPABASE_URL: ${{ vars.CRAWL_IT65B_SUPABASE_URL }}
          CRAWL_IT65B_SUPABASE_SECRET_KEY: ${{ secrets.CRAWL_IT65B_SUPABASE_SECRET_KEY }}
        run: |
          test "$CRAWL_IT65B_SUPABASE_URL" = "https://ecrafjdummcdfycznitx.supabase.co" || exit 1
          case "$CRAWL_IT65B_SUPABASE_SECRET_KEY" in sb_secret_*) ;; *) exit 1;; esac
          echo "::add-mask::$CRAWL_IT65B_SUPABASE_SECRET_KEY"
      - name: One approved source, at most 100 Wikidata CC0 structured records
        working-directory: services/worker
        env:
          CRAWL_IT65B_SUPABASE_URL: ${{ vars.CRAWL_IT65B_SUPABASE_URL }}
          CRAWL_IT65B_SUPABASE_SECRET_KEY: ${{ secrets.CRAWL_IT65B_SUPABASE_SECRET_KEY }}
        run: python -m app.netfast2_wikidata_feed
